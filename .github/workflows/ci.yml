name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: basecom
          POSTGRES_PASSWORD: basecom-dev
          POSTGRES_DB: basecom_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U basecom" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      DATABASE_URL: postgres://basecom:basecom-dev@localhost:5432/basecom_crm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @basecom/shared build
      - run: pnpm typecheck
      - run: pnpm test
