name: Instaladores da aplicação

# Gera os instaladores Windows e Mac (Intel) ligados a https://crm.basecom.pt.
# Corre ao enviar uma etiqueta "desktop-v0.1.0" (ou à mão, no separador Actions).
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_URL: https://crm.basecom.pt
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @basecom/shared build
      - run: pnpm --filter @basecom/desktop dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: BASECOM-CRM-${{ matrix.target }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
