name: App Android

# Gera a app BASECOM para Android (APK para instalar diretamente nos telemóveis).
# Corre à mão (separador Actions) ou quando muda alguma coisa em apps/android.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    env:
      VERSION_NAME: 0.8.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Chave de assinatura: a mesma entre versões, para as atualizações instalarem por cima.
      # Se existir o segredo ANDROID_KEYSTORE_B64 (chave própria), usa-o; senão, guarda a chave de teste em cache.
      - name: Chave de teste (cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: basecom-android-debug-keystore-v1
      - name: Preparar chave
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/basecom.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/basecom.jks" >> "$GITHUB_ENV";
          elif [ ! -f ~/.android/debug.keystore ]; then mkdir -p ~/.android && keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Gerar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk "BASECOM-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BASECOM-Android-${{ env.VERSION_NAME }}
          path: apps/android/BASECOM-*.apk
          if-no-files-found: error
